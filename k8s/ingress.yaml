# ==============================================================================
# Skilli DevOps Lab — Kubernetes Ingress Manifest for Cal-App
# Live Domain: anis2401098.imcc.skilli.in
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cal-app-ingress
  namespace: student-anis2401098
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - anis2401098.imcc.skilli.in
      secretName: student-app-tls
  rules:
    - host: anis2401098.imcc.skilli.in
      http:
        paths:
          # API Requests
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cal-app-service
                port:
                  number: 3000

          # Root & Static Assets
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cal-app-service
                port:
                  number: 3000
